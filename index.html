<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เก็บผลไม้ ใส่ตะกร้า · AR เกม</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #0b2b1e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .game-container {
      background: #1e4d3a;
      padding: 20px;
      border-radius: 40px 40px 20px 20px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.6);
      display: inline-block;
      position: relative;
    }
    .canvas-wrapper {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: inset 0 0 0 2px #7fb39b;
    }
    #gameCanvas {
      display: block;
      width: 800px;
      height: 600px;
      background: #8bbf9e;
      cursor: none;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding: 0 10px;
      color: #f3f7e8;
      font-weight: 600;
      font-size: 1.2rem;
      text-shadow: 1px 2px 3px #1a2f25;
    }
    .score-box {
      background: #2c5d45;
      padding: 8px 24px;
      border-radius: 40px;
      border: 1px solid #b1d5b9;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .reset-btn {
      background: #b75f4a;
      border: none;
      color: white;
      font-weight: bold;
      padding: 8px 24px;
      border-radius: 40px;
      font-size: 1.1rem;
      box-shadow: 0 4px 0 #6f3d2e;
      transition: 0.08s linear;
      cursor: pointer;
      border: 1px solid #e3b49a;
    }
    .reset-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #6f3d2e;
    }
    .hint {
      color: #d4e8d0;
      font-size: 0.9rem;
      background: #1f3f30;
      padding: 4px 18px;
      border-radius: 40px;
      border: 1px solid #77a58b;
    }
    #webcam-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      border-radius: 24px;
      opacity: 0.3;
      object-fit: cover;
    }
    .fruit-emoji-big {
      font-size: 2.2rem;
      line-height: 1;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <!-- กล้องแสดงผลแบบโปร่งแสง (overlay) -->
    <video id="webcam" autoplay playsinline style="display: none;"></video>
  </div>
  <div class="status-bar">
    <span class="hint">🍎 หยิบ → วางในตะกร้า</span>
    <span class="score-box">🧺 <span id="scoreDisplay">0</span></span>
    <button class="reset-btn" id="resetBtn">🔄 เริ่มใหม่</button>
  </div>
</div>

<!-- โหลด MediaPipe Hands ผ่าน CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
  (function() {
    // --- องค์ประกอบเกม ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const resetBtn = document.getElementById('resetBtn');
    const video = document.getElementById('webcam');

    // ขนาด canvas
    const CW = 800, CH = 600;

    // --- สถานะเกม ---
    let fruits = [];                  // ผลไม้ในฉาก { x, y, emoji, size }
    let basket = { x: 400, y: 540, w: 140, h: 50 }; // ตะกร้า
    let score = 0;

    // สถานะนิ้ว (จาก MediaPipe)
    let indexTip = null;    // { x, y } (พิกัดใน canvas)
    let thumbTip = null;    // { x, y }
    let pinch = false;     // กำลังหยิบจับ? (นิ้วชี้+นิ้วโป้งใกล้กัน)
    let isHolding = false; // กำลังถือผลไม้อยู่?
    let heldFruitIndex = -1; // index ใน fruits ที่กำลังถือ (หรือ -1)

    // ตัวแปรสำหรับตรวจจับการปล่อย ( pinch -> false )
    let prevPinch = false;

    // --- สร้างผลไม้เริ่มต้น ---
    function initFruits(count = 7) {
      const emojis = ['🍎', '🍐', '🍊', '🍋', '🍇', '🍉', '🍓', '🍑', '🍒', '🥝'];
      fruits = [];
      for (let i = 0; i < count; i++) {
        let overlap = true;
        let attempts = 0;
        let x, y;
        while (overlap && attempts < 100) {
          x = 60 + Math.random() * (CW - 120);
          y = 60 + Math.random() * (380); // ให้ผลไม้อยู๋เหนือตะกร้า
          overlap = fruits.some(f => Math.hypot(f.x - x, f.y - y) < 50);
          attempts++;
        }
        fruits.push({
          x, y,
          emoji: emojis[Math.floor(Math.random() * emojis.length)],
          size: 30 + Math.floor(Math.random() * 14) // 30~44px
        });
      }
    }

    // --- รีเซ็ตเกม ---
    function resetGame() {
      score = 0;
      updateScore();
      initFruits(7);
      isHolding = false;
      heldFruitIndex = -1;
      // ไม่รีเซ็ต pinch state
    }

    // --- อัปเดตคะแนนบน UI ---
    function updateScore() {
      scoreSpan.textContent = score;
    }

    // --- ฟังก์ชันเช็คว่าอยู่ในตะกร้า (เฉพาะส่วนล่าง) ---
    function isOverBasket(x, y) {
      const bx = basket.x - basket.w/2;
      const by = basket.y - basket.h/2;
      return (x >= bx && x <= bx + basket.w && y >= by && y <= by + basket.h);
    }

    // --- หยิบผลไม้ (ถ้าอยู่ใต้นิ้ว) ---
    function tryPickFruit(px, py) {
      // หาผลไม้ที่อยู่ใกล้ (ระยะ < 50px) และอยู่เหนือตะกร้า (ไม่อยากให้หยิบจากในตะกร้า)
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        const dist = Math.hypot(px - f.x, py - f.y);
        if (dist < 50 && !isOverBasket(f.x, f.y)) {
          // หยิบผลไม้นี้
          heldFruitIndex = i;
          isHolding = true;
          return true;
        }
      }
      return false;
    }

    // --- ปล่อยผลไม้ (วางในตะกร้าหรือปล่อยกลางอากาศ) ---
    function dropFruit() {
      if (!isHolding || heldFruitIndex === -1) return false;

      const f = fruits[heldFruitIndex];
      // ตรวจสอบว่าอยู่เหนือตะกร้า (ใช้ตำแหน่งปัจจุบันของผลไม้ที่ตามมือ)
      if (isOverBasket(f.x, f.y)) {
        // ✅ เก็บใส่ตะกร้า: ลบผลไม้ออก, เพิ่มคะแนน
        fruits.splice(heldFruitIndex, 1);
        score++;
        updateScore();
        // ถ้าผลไม้เหลือน้อย ให้เติมใหม่
        if (fruits.length < 3) {
          initFruits(5);
        }
      } else {
        // ❌ วางกลางอากาศ: ผลไม้หล่นลงมา (ปรับ y ลงไปด้านล่าง แต่ไม่หาย)
        // ปล่อยให้ผลไม้ค้างที่ตำแหน่งมือ (แล้วค่อยๆ ตก? แต่เกมนี้ให้หล่นลงพื้น)
        f.y = Math.min(f.y + 30, 560); // ตกไปใกล้พื้น
        // ถ้าตกไปไกลมาก เอากลับขึ้นมาใหม่? (ให้หายไป? แต่เกมนี้ทำให้หายไปแล้วเกิดใหม่)
        if (f.y > 570) {
          // ถ้าหล่นออกนอกจอ -> ลบแล้วสร้างใหม่
          fruits.splice(heldFruitIndex, 1);
          if (fruits.length < 5) initFruits(3);
        }
      }

      isHolding = false;
      heldFruitIndex = -1;
      return true;
    }

    // --- ฟังก์ชันหลักอัปเดตทุกเฟรม (เรียกจาก MediaPipe) ---
    function updateGame() {
      // 1. อัปเดตตำแหน่งผลไม้ที่ถือตามนิ้ว
      if (isHolding && heldFruitIndex !== -1 && indexTip) {
        const f = fruits[heldFruitIndex];
        if (f) {
          f.x = indexTip.x;
          f.y = indexTip.y;
          // ป้องกันผลไม้หลุดจากขอบจอ
          f.x = Math.min(Math.max(f.x, 20), CW - 20);
          f.y = Math.min(Math.max(f.y, 20), CH - 20);
        } else {
          // ถ้าผลไม้ถูกลบไปแล้ว (กรณีผิดพลาด) รีเซ็ตสถานะ
          isHolding = false;
          heldFruitIndex = -1;
        }
      }

      // 2. ตรวจจับการหยิบ (pinch เปลี่ยนจาก false -> true)
      if (pinch && !prevPinch && !isHolding && indexTip) {
        // พยายามหยิบผลไม้ ณ ตำแหน่งนิ้วชี้
        const picked = tryPickFruit(indexTip.x, indexTip.y);
        if (!picked) {
          // ถ้าไม่เจอผลไม้ -> ไม่เกิดอะไร
        }
      }

      // 3. ตรวจจับการปล่อย (pinch เปลี่ยนจาก true -> false)
      if (!pinch && prevPinch && isHolding) {
        dropFruit();
      }

      // 4. ถ้าไม่มี pinch และกำลังถืออยู่ (แต่ mediapipe สูญเสีย?) 
      //   แต่เราไม่ทำอะไร ปล่อยให้ถือต่อไปจนกว่าจะปล่อย

      // อัปเดต prevPinch
      prevPinch = pinch;

      // --- วาดฉาก ---
      drawScene();
    }

    // --- วาดทุกอย่าง ---
    function drawScene() {
      ctx.clearRect(0, 0, CW, CH);

      // 1. พื้นหลัง (หญ้า/ฟ้า)
      const grad = ctx.createLinearGradient(0, 0, 0, CH);
      grad.addColorStop(0, '#b5e0c4');
      grad.addColorStop(0.7, '#7fb39b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CW, CH);

      // 2. วาดตะกร้า
      const bx = basket.x - basket.w/2;
      const by = basket.y - basket.h/2;
      ctx.shadowColor = '#2a4533';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#a77b4f';
      ctx.strokeStyle = '#5d3d27';
      ctx.lineWidth = 5;
      // ตัวตะกร้า
      ctx.beginPath();
      ctx.ellipse(basket.x, basket.y-4, basket.w/2, basket.h/2.5, 0, 0, Math.PI*2);
      ctx.fillStyle = '#c69c6d';
      ctx.fill();
      ctx.strokeStyle = '#5d3d27';
      ctx.lineWidth = 4;
      ctx.stroke();
      // ขอบตะกร้า (ลายไม้)
      ctx.fillStyle = '#b5875a';
      ctx.shadowBlur = 6;
      ctx.fillRect(bx+10, by-6, basket.w-20, 12);
      ctx.fillStyle = '#8b6a42';
      ctx.fillRect(bx+20, by-2, basket.w-40, 4);

      // 3. วาดผลไม้ทั้งหมด (ยกเว้นตัวที่กำลังถือ, แต่ถ้ากำลังถือ ให้วาดที่ตำแหน่งนิ้ว)
      for (let i = 0; i < fruits.length; i++) {
        if (isHolding && i === heldFruitIndex) continue; // ข้ามตัวที่ถือ (ไปวาดที่นิ้ว)
        const f = fruits[i];
        ctx.font = `${f.size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#1e3d2a';
        ctx.fillText(f.emoji, f.x, f.y);
      }

      // 4. ถ้ากำลังถือ ให้วาดผลไม้ที่นิ้ว (พร้อมเงา)
      if (isHolding && heldFruitIndex !== -1 && fruits[heldFruitIndex]) {
        const f = fruits[heldFruitIndex];
        ctx.font = `${f.size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 34;
        ctx.shadowColor = '#2d5a3b';
        ctx.fillText(f.emoji, indexTip.x, indexTip.y-4);
        // วงกลมแสดงการหยิบ
        ctx.beginPath();
        ctx.arc(indexTip.x, indexTip.y-4, 24, 0, Math.PI*2);
        ctx.strokeStyle = '#f5e56b';
        ctx.lineWidth = 4;
        ctx.shadowBlur = 18;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 235, 100, 0.2)';
        ctx.fill();
      }

      // 5. แสดงสถานะนิ้ว (UI ช่วย)
      if (indexTip) {
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(indexTip.x, indexTip.y, 8, 0, 2*Math.PI);
        ctx.fillStyle = pinch ? '#ffd966' : '#c7e6c7';
        ctx.strokeStyle = '#2b5c3a';
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();
        if (thumbTip) {
          ctx.beginPath();
          ctx.arc(thumbTip.x, thumbTip.y, 8, 0, 2*Math.PI);
          ctx.fillStyle = '#c7e6c7';
          ctx.fill();
          ctx.stroke();
        }
      }

      // รีเซ็ต shadow
      ctx.shadowBlur = 0;
    }

    // --- MediaPipe Hands ---
    function onResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        // ดึงตำแหน่งนิ้วชี้ (index 8) และนิ้วโป้ง (index 4)
        const index = landmarks[8];
        const thumb = landmarks[4];
        if (index && thumb) {
          // แปลงพิกัดจาก 0-1 เป็น canvas
          indexTip = { x: index.x * CW, y: index.y * CH };
          thumbTip = { x: thumb.x * CW, y: thumb.y * CH };
          // ตรวจจับ pinch (ระยะห่าง < 30px)
          const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
          pinch = dist < 32;
        } else {
          indexTip = null;
          thumbTip = null;
          pinch = false;
        }
      } else {
        // ไม่เห็นมือ
        indexTip = null;
        thumbTip = null;
        pinch = false;
        // ถ้ากำลังถืออยู่ แต่ไม่เจอมือ -> ปล่อยผลไม้ (เพื่อไม่ให้ค้าง)
        if (isHolding) {
          dropFruit();
        }
      }
      // อัปเดตเกมทุกเฟรม
      updateGame();
    }

    // เริ่มต้น MediaPipe
    const hands = new Hands({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
      }
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    // เปิดกล้อง
    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 800,
      height: 600
    });
    camera.start();

    // --- ปุ่มรีเซ็ต ---
    resetBtn.addEventListener('click', () => {
      resetGame();
      // ถ้ากำลังถืออยู่ ให้ปล่อย
      if (isHolding) {
        dropFruit();
      }
      isHolding = false;
      heldFruitIndex = -1;
      pinch = false;
      prevPinch = false;
      indexTip = null;
      thumbTip = null;
      updateGame();
    });

    // --- เริ่มเกมครั้งแรก ---
    resetGame();
    // วาดครั้งแรก
    updateGame();

    // (ไม่ต้องแสดงวิดีโอ เพราะใช้เป็น input เท่านั้น)
  })();
</script>
</body>
</html>
