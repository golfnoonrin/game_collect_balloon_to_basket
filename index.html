<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เก็บผลไม้ ใส่ตะกร้า · AR เกม</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #0b2b1e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .game-container {
      background: #1e4d3a;
      padding: 20px;
      border-radius: 40px 40px 20px 20px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.6);
      display: inline-block;
      position: relative;
    }
    .canvas-wrapper {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: inset 0 0 0 2px #7fb39b;
      background: #8bbf9e;
    }
    #gameCanvas {
      display: block;
      width: 800px;
      height: 600px;
      background: #8bbf9e;
      cursor: none;
    }
    #webcam-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.25;
      pointer-events: none;
      border-radius: 24px;
      transform: scaleX(-1);
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding: 0 10px;
      color: #f3f7e8;
      font-weight: 600;
      font-size: 1.2rem;
      text-shadow: 1px 2px 3px #1a2f25;
    }
    .score-box {
      background: #2c5d45;
      padding: 8px 24px;
      border-radius: 40px;
      border: 1px solid #b1d5b9;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .reset-btn {
      background: #b75f4a;
      border: none;
      color: white;
      font-weight: bold;
      padding: 8px 24px;
      border-radius: 40px;
      font-size: 1.1rem;
      box-shadow: 0 4px 0 #6f3d2e;
      transition: 0.08s linear;
      cursor: pointer;
      border: 1px solid #e3b49a;
    }
    .reset-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #6f3d2e;
    }
    .hint {
      color: #d4e8d0;
      font-size: 0.9rem;
      background: #1f3f30;
      padding: 4px 18px;
      border-radius: 40px;
      border: 1px solid #77a58b;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 1.4rem;
      background: rgba(0,0,0,0.6);
      padding: 16px 32px;
      border-radius: 16px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <video id="webcam" autoplay playsinline style="display: none;"></video>
    <video id="webcam-feed" autoplay playsinline muted></video>
    <div class="loading" id="loadingText">⏳ กำลังเปิดกล้อง...</div>
  </div>
  <div class="status-bar">
    <span class="hint">🍎 หยิบ → วางในตะกร้า</span>
    <span class="score-box">🧺 <span id="scoreDisplay">0</span></span>
    <button class="reset-btn" id="resetBtn">🔄 เริ่มใหม่</button>
  </div>
</div>

<!-- ใช้ MediaPipe ผ่าน CDN แบบใหม่ -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const resetBtn = document.getElementById('resetBtn');
    const video = document.getElementById('webcam');
    const videoFeed = document.getElementById('webcam-feed');
    const loadingText = document.getElementById('loadingText');

    const CW = 800, CH = 600;

    // --- สถานะเกม ---
    let fruits = [];
    const basket = { x: 400, y: 540, w: 140, h: 50 };
    let score = 0;

    // สถานะนิ้ว
    let indexTip = null;
    let thumbTip = null;
    let pinch = false;
    let prevPinch = false;
    let isHolding = false;
    let heldFruitIndex = -1;

    // --- สร้างผลไม้ ---
    function initFruits(count = 8) {
      const emojis = ['🍎', '🍐', '🍊', '🍋', '🍇', '🍉', '🍓', '🍑', '🍒', '🥝', '🍌', '🍍'];
      fruits = [];
      for (let i = 0; i < count; i++) {
        let x, y, overlap;
        let attempts = 0;
        do {
          x = 50 + Math.random() * (CW - 100);
          y = 50 + Math.random() * 380;
          overlap = fruits.some(f => Math.hypot(f.x - x, f.y - y) < 55);
          attempts++;
        } while (overlap && attempts < 50);
        fruits.push({
          x, y,
          emoji: emojis[Math.floor(Math.random() * emojis.length)],
          size: 32 + Math.floor(Math.random() * 16)
        });
      }
    }

    function resetGame() {
      score = 0;
      updateScore();
      initFruits(8);
      isHolding = false;
      heldFruitIndex = -1;
      pinch = false;
      prevPinch = false;
    }

    function updateScore() {
      scoreSpan.textContent = score;
    }

    function isOverBasket(x, y) {
      const bx = basket.x - basket.w/2;
      const by = basket.y - basket.h/2;
      return (x >= bx && x <= bx + basket.w && y >= by && y <= by + basket.h);
    }

    function tryPickFruit(px, py) {
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        const dist = Math.hypot(px - f.x, py - f.y);
        if (dist < 50 && !isOverBasket(f.x, f.y)) {
          heldFruitIndex = i;
          isHolding = true;
          return true;
        }
      }
      return false;
    }

    function dropFruit() {
      if (!isHolding || heldFruitIndex === -1) return false;

      const f = fruits[heldFruitIndex];
      if (isOverBasket(f.x, f.y)) {
        fruits.splice(heldFruitIndex, 1);
        score++;
        updateScore();
        if (fruits.length < 3) {
          initFruits(5);
        }
      } else {
        f.y = Math.min(f.y + 40, 580);
        if (f.y > 580) {
          fruits.splice(heldFruitIndex, 1);
          if (fruits.length < 5) initFruits(3);
        }
      }

      isHolding = false;
      heldFruitIndex = -1;
      return true;
    }

    // --- วาดฉาก ---
    function drawScene() {
      ctx.clearRect(0, 0, CW, CH);

      // พื้นหลัง
      const grad = ctx.createLinearGradient(0, 0, 0, CH);
      grad.addColorStop(0, '#b5e0c4');
      grad.addColorStop(0.7, '#7fb39b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CW, CH);

      // วาดตะกร้า
      const bx = basket.x - basket.w/2;
      const by = basket.y - basket.h/2;
      ctx.shadowColor = '#2a4533';
      ctx.shadowBlur = 14;
      
      // ตัวตะกร้า
      ctx.beginPath();
      ctx.ellipse(basket.x, basket.y-4, basket.w/2, basket.h/2.5, 0, 0, Math.PI*2);
      ctx.fillStyle = '#c69c6d';
      ctx.fill();
      ctx.strokeStyle = '#5d3d27';
      ctx.lineWidth = 4;
      ctx.stroke();
      
      ctx.fillStyle = '#b5875a';
      ctx.shadowBlur = 6;
      ctx.fillRect(bx+10, by-6, basket.w-20, 12);
      ctx.fillStyle = '#8b6a42';
      ctx.fillRect(bx+20, by-2, basket.w-40, 4);

      // วาดผลไม้
      for (let i = 0; i < fruits.length; i++) {
        if (isHolding && i === heldFruitIndex) continue;
        const f = fruits[i];
        ctx.font = `${f.size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#1e3d2a';
        ctx.fillText(f.emoji, f.x, f.y);
      }

      // วาดผลไม้ที่ถือ
      if (isHolding && heldFruitIndex !== -1 && fruits[heldFruitIndex]) {
        const f = fruits[heldFruitIndex];
        ctx.font = `${f.size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 34;
        ctx.shadowColor = '#2d5a3b';
        const drawX = indexTip ? indexTip.x : f.x;
        const drawY = indexTip ? indexTip.y - 4 : f.y;
        ctx.fillText(f.emoji, drawX, drawY);
        
        // วงกลมแสดงการหยิบ
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(drawX, drawY, 28, 0, Math.PI*2);
        ctx.strokeStyle = '#f5e56b';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 235, 100, 0.15)';
        ctx.fill();
      }

      // แสดงตำแหน่งนิ้ว
      ctx.shadowBlur = 0;
      if (indexTip) {
        ctx.beginPath();
        ctx.arc(indexTip.x, indexTip.y, 10, 0, 2*Math.PI);
        ctx.fillStyle = pinch ? '#ffd966' : 'rgba(200, 230, 200, 0.7)';
        ctx.strokeStyle = '#2b5c3a';
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();
        
        // เส้นเชื่อมนิ้ว
        if (thumbTip) {
          ctx.beginPath();
          ctx.moveTo(indexTip.x, indexTip.y);
          ctx.lineTo(thumbTip.x, thumbTip.y);
          ctx.strokeStyle = pinch ? '#ffd966' : 'rgba(200, 230, 200, 0.3)';
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.stroke();
          ctx.setLineDash([]);
          
          ctx.beginPath();
          ctx.arc(thumbTip.x, thumbTip.y, 10, 0, 2*Math.PI);
          ctx.fillStyle = 'rgba(200, 230, 200, 0.5)';
          ctx.fill();
          ctx.stroke();
        }
      }

      ctx.shadowBlur = 0;
    }

    // --- MediaPipe ---
    function onResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const index = landmarks[8];
        const thumb = landmarks[4];
        if (index && thumb) {
          indexTip = { 
            x: (1 - index.x) * CW,  // กลับด้านให้ตรงกับวิดีโอ
            y: index.y * CH 
          };
          thumbTip = { 
            x: (1 - thumb.x) * CW,
            y: thumb.y * CH 
          };
          const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
          pinch = dist < 35;
        }
      } else {
        if (isHolding) {
          dropFruit();
        }
        indexTip = null;
        thumbTip = null;
        pinch = false;
      }
      
      // อัปเดตเกม
      if (pinch && !prevPinch && !isHolding && indexTip) {
        tryPickFruit(indexTip.x, indexTip.y);
      }
      
      if (!pinch && prevPinch && isHolding) {
        dropFruit();
      }
      
      prevPinch = pinch;
      
      // อัปเดตผลไม้ที่ถือตามนิ้ว
      if (isHolding && heldFruitIndex !== -1 && indexTip) {
        const f = fruits[heldFruitIndex];
        if (f) {
          f.x = Math.min(Math.max(indexTip.x, 20), CW - 20);
          f.y = Math.min(Math.max(indexTip.y, 20), CH - 20);
        }
      }
      
      drawScene();
    }

    // --- เริ่ม MediaPipe ---
    const hands = new Hands({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`;
      }
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    // --- เปิดกล้อง ---
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: 800, height: 600, facingMode: 'user' } 
        });
        video.srcObject = stream;
        videoFeed.srcObject = stream;
        await video.play();
        loadingText.style.display = 'none';
        
        const camera = new Camera(video, {
          onFrame: async () => {
            try {
              await hands.send({ image: video });
            } catch (e) {
              // ignore
            }
          },
          width: 800,
          height: 600
        });
        camera.start();
      } catch (err) {
        loadingText.textContent = '❌ ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการเข้าถึงกล้อง';
        console.error(err);
      }
    }

    // --- ปุ่มรีเซ็ต ---
    resetBtn.addEventListener('click', () => {
      if (isHolding) {
        dropFruit();
      }
      resetGame();
      drawScene();
    });

    // --- เริ่มเกม ---
    resetGame();
    drawScene();
    startCamera();

    // วาด loop เพิ่มเติม (กันค้าง)
    setInterval(() => {
      if (!isHolding && !pinch) {
        drawScene();
      }
    }, 100);

  })();
</script>
</body>
</html>
